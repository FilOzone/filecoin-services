name: Solidity Contract Size Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check_contract_size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      
      - name: Install Dependencies
        run: |
          cd service_contracts 
          forge install

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Build and check deployment target sizes
        run: |
          cd service_contracts
          ./tools/check-contract-size.sh \
            --check \
            --output current_sizes.json \
            --github-summary

      - name: Build base branch sizes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          mkdir base_build
          git worktree add base_build origin/main
          cd base_build/service_contracts
          SIZE_TOOL="$GITHUB_WORKSPACE/service_contracts/tools/check-contract-size.sh"
          POLICY_ARGS=()
          if [ ! -f contract-size-policy.json ]; then
            echo "Base branch predates contract-size-policy.json; using the current deployment target policy"
            POLICY_ARGS=(--policy "$GITHUB_WORKSPACE/service_contracts/contract-size-policy.json")
          fi
          if "$SIZE_TOOL" "${POLICY_ARGS[@]}" --offline \
              --output "$GITHUB_WORKSPACE/service_contracts/base_sizes.json"; then
            echo "Offline build succeeded"
          else
            echo "Offline build failed, installing dependencies"
            forge install
            "$SIZE_TOOL" "${POLICY_ARGS[@]}" \
              --output "$GITHUB_WORKSPACE/service_contracts/base_sizes.json"
          fi
          cd ../..
          git worktree remove --force base_build

      - name: Compare contract sizes
        run: |
          cd service_contracts
          if [ -f base_sizes.json ]; then
            set -o pipefail
            ./tools/compare_contract_sizes.sh current_sizes.json base_sizes.json \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No base size data found - skipping delta comparison."
          fi
