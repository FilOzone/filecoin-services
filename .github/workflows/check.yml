name: Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check-gen:
    name: Check Generated Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check generated files
        run: |
          cd service_contracts
          make clean-gen
          make gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Generated files are not up to date!"
            echo "Uncommitted changes detected:"
            git status --porcelain
            echo ""
            echo "Please run 'make gen' in service_contracts/ and commit the changes."
            exit 1
          fi
          echo "Generated files are up to date ✓"

  check-deployments:
    name: Check deployments.json Checksums
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Validate EIP-55 checksums in deployments.json
        run: |
          bash service_contracts/tools/check_deployments_checksums.sh service_contracts/deployments.json
