name: Deploy All

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-all-anvil:
    name: Deploy the Warm Storage stack to anvil
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache the ERC-8167 assembler
        uses: actions/cache@v5
        with:
          path: ~/.cache/wjmelements-evm
          key: wjmelements-evm-${{ runner.os }}-${{ hashFiles('service_contracts/Makefile') }}

      - name: Build ERC-8167 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          cd service_contracts
          make install-evm

      - name: Deploy to anvil
        run: |
          export PATH="/home/runner/.config/.foundry/bin:$PATH"
          cd service_contracts
          ./tools/warm-storage-deploy-all-test.sh
