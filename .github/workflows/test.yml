name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install Dependencies
        run: |
          cd service_contracts
          make install

      - name: Build ERC-8167 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          git clone https://github.com/wjmelements/evm.git "$RUNNER_TEMP/erc8167-evm"
          git -C "$RUNNER_TEMP/erc8167-evm" checkout 4123f3a47e8032499fc0ddfe178f35c034ae77a7
          git -C "$RUNNER_TEMP/erc8167-evm" submodule update --init --recursive
          make -C "$RUNNER_TEMP/erc8167-evm" bin/evm
          echo "$RUNNER_TEMP/erc8167-evm/bin" >> "$GITHUB_PATH"

      - name: Run build
        run: |
          export PATH="/home/runner/.config/.foundry/bin:$PATH"
          cd service_contracts
          make build

      - name: Run tests
        run: |
          export PATH="/home/runner/.config/.foundry/bin:$PATH"
          cd service_contracts
          make test

      - name: Generate coverage report
        run: |
          export PATH="/home/runner/.config/.foundry/bin:$PATH"
          cd service_contracts
          echo "::warning::Coverage is currently disabled due to Solidity stack depth limitations"
          echo "The combination of complex nested mappings, Payments contract interactions, and coverage"
          echo "instrumentation exceeds Solidity's stack depth limits even with --ir-minimum flag."
          echo "See: https://github.com/foundry-rs/foundry/issues/3357"
          echo ""
          echo "Attempting coverage generation (expected to fail)..."
          make coverage-lcov || echo "Coverage generation failed as expected due to stack depth issues"
          make coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./service_contracts
          files: ./lcov.info
          fail_ci_if_error: false
