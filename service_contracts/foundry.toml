[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.37"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

# Foundry's defaults, plus Solidity 0.8.37 warnings from fws-payments (9170),
# OpenZeppelin/forge-std (6335), forge-std (8506), and the warning limit (4591).
ignored_error_codes = [
    "license",
    "code-size",
    "init-code-size",
    "transient-storage",
    "transfer-deprecated",
    "natspec-memory-safe-assembly-deprecated",
    9170,
    6335,
    8506,
    4591,
]

# For dependencies
remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'forge-std/=lib/forge-std/src/',
    '@fws-payments/=lib/fws-payments/src/',
    '@pdp/=lib/pdp/src/',
    '@session-key-registry/=lib/session-key-registry/src/',
    '@fvm-solidity/=lib/pdp/lib/fvm-solidity/src/',
    '@pythnetwork/pyth-sdk-solidity/=lib/pdp/lib/pyth-sdk-solidity/',
    'solady/=lib/solady/src/',
]

# Allow reading test data files
fs_permissions = [{ access = "read", path = "./test" }]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "asm-keccak256",
    "block-timestamp",
    "custom-errors",
    "incorrect-shift",
    "mixed-case-function",
    "mixed-case-variable",
    "multi-contract-file",
    "pascal-case-struct",
    "screaming-snake-case-immutable",
    "unsafe-cheatcode",
    "unsafe-typecast",
]
