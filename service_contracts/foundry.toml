[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.30"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# secp256r1 precompile at 0x100 (RIP-7212 / EIP-7951) is implemented by revm only at evm_version=osaka.
# MultiMethodAuthorizer and its tests exercise it; osaka is a superset for everything else here.
evm_version = "osaka"

# For dependencies
remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
    'forge-std/=lib/forge-std/src/',
    '@fws-payments/=lib/fws-payments/src/',
    '@pdp/=lib/pdp/src/',
    '@session-key-registry/=lib/session-key-registry/src/',
    '@fvm-solidity/=lib/pdp/lib/fvm-solidity/src/',
    '@pythnetwork/pyth-sdk-solidity/=lib/pdp/lib/pyth-sdk-solidity/',
]

# Allow reading test data files
fs_permissions = [{ access = "read", path = "./test" }]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "asm-keccak256",
    "block-timestamp",
    "custom-errors",
    "incorrect-shift",
    "mixed-case-function",
    "mixed-case-variable",
    "multi-contract-file",
    "pascal-case-struct",
    "screaming-snake-case-immutable",
    "unsafe-cheatcode",
    "unsafe-typecast",
]
